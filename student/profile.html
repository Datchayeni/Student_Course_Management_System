<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - EduTrack</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="../css/stylesheet.css">

    <link
        rel="stylesheet"
        href="../css/student.css">

</head>


<body>


<!-- ======================================================
     NAVBAR
====================================================== -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container-fluid">


        <!-- Brand -->

        <a
            class="navbar-brand fw-bold"
            href="student-dashboard.html">

            EduTrack

        </a>


        <!-- Mobile Button -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#studentNavbar">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navigation -->

        <div
            class="collapse navbar-collapse"
            id="studentNavbar">

            <ul class="navbar-nav ms-auto align-items-lg-center">


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="student-dashboard.html">

                        Dashboard

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="browse-courses.html">

                        Browse Courses

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="my-courses.html">

                        My Courses

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="notifications.html">

                        Notifications

                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="profile.html">

                        Profile

                    </a>

                </li>


                <li class="nav-item ms-lg-2">

                    <a
                        class="btn btn-outline-danger"
                        href="#"
                        id="logoutBtn">

                        <i class="bi bi-box-arrow-right"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- ======================================================
     PROFILE SECTION
====================================================== -->

<section class="py-5">

    <div class="container">


        <!-- Page Heading -->

        <div class="mb-4">

            <h2 class="fw-bold">

                My Profile

            </h2>

            <p class="text-muted">

                View your personal and academic information.

            </p>

        </div>



        <!-- Profile Card -->

        <div class="row justify-content-center">

            <div class="col-lg-8">


                <div class="card border-0 shadow-sm">


                    <!-- Profile Header -->

                    <div class="card-body text-center py-4">


                        <img
                            src="../images/avatar.png"
                            alt="Student Avatar"
                            id="profileAvatar"
                            class="rounded-circle mb-3"
                            width="110"
                            height="110">


                        <h3
                            class="fw-bold"
                            id="profileName">

                            Student Name

                        </h3>


                        <p
                            class="text-muted"
                            id="profileRole">

                            Student

                        </p>

                    </div>



                    <!-- Student Details -->

                    <div class="card-body border-top">


                        <h5 class="fw-bold mb-4">

                            Personal Information

                        </h5>


                        <div class="row g-4">


                            <!-- Name -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Full Name
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileFullName">

                                    -

                                </p>

                            </div>


                            <!-- Student ID -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Student ID
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileStudentID">

                                    -

                                </p>

                            </div>


                            <!-- Email -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Email Address
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileEmail">

                                    -

                                </p>

                            </div>


                            <!-- Department -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Department
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileDepartment">

                                    -

                                </p>

                            </div>


                            <!-- Year -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Academic Year
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileYear">

                                    -

                                </p>

                            </div>


                            <!-- Role -->

                            <div class="col-md-6">

                                <label class="text-muted">
                                    Account Type
                                </label>

                                <p
                                    class="fw-semibold"
                                    id="profileAccountType">

                                    Student

                                </p>

                            </div>

                        </div>

                    </div>



                    <!-- Actions -->

                    <div class="card-footer bg-white border-top p-4">

                        <a
                            href="student-dashboard.html"
                            class="btn btn-primary">

                            <i class="bi bi-arrow-left"></i>

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Student JS -->

<script src="../js/student.js"></script>


</body>

</html>
