<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | EduTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <link rel="stylesheet" href="../css/Stylesheet.css">
    </head>
    <body>
        <section class="login-page">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5 col-md-7">
                        <div class="card shadow login-card">
                            <div class="card-body p-5">
                                <h2 class="text-center mb-4">
                                    <i class="bi bi-mortarboard-fill"></i>EduTrack
                                </h2>

                                <p class="text-center text-muted mb-4">Login to continue Learning</p>

                                <ul class="nav nav-pills nav-justified mb-4">
                                    <li class="nav-item">
                                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#student">Student</button>
                                    </li>

                                    <li class="nav-item">
                                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#admin">Admin</button>
                                    </li>
                                </ul>

                                <div class="tab-content">
                                    <!--Student-->
                                    <div class="tab-pane fade show active" id="student">
                                        <form id="studentLoginForm">
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input type="email" class="form-control" id="studentEmail" placeholder="Enter your email">
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Password</label>
                                                <input type="password" class="form-control" id="studentPassword" placeholder="Enter your password">
                                            </div>

                                            <div class="d-flex justify-content-between mb-4">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" id="remember">

                                                    <label class="form-check-label" for="remember">
                                                        Remember Me
                                                    </label>
                                                </div>
                                                <a href="forgot-password.html">Forgot Password?</a>
                                            </div>

                                            <button class="btn btn-primary w-100">Student Login</button>

                                            <p class="text-center mt-4">Don't have an account?
                                                <a href="register.html">Register</a>
                                            </p>
                                        </form>
                                    </div>
                                    
                                    <!--Admin-->
                                    <div class="tab-pane fade" id="admin">
                                        <form id="adminLoginForm">
                                            <div class="mb-3">
                                                <label class="form-label">Admin Email</label>
                                                <input type="email" class="form-control" id="adminEmail" placeholder="Enter admin email">
                                            </div>

                                            <div class="mb-3">
                                                <label class="form-label">Password</label>
                                                <input type="password" class="form-control" placeholder="Enter your password">
                                            </div>

                                            <button class="btn btn-primary w-100">Admin Login</button>
                                        </form>
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>
        </section>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/auth.js"></script>
    </body>
</html>
